name: CI — Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./docs/pg-sd2

      # 4. Check the app file exists and syntax is valid
      - name: Lint check (node --check)
        run: node --check app/app.js
        working-directory: ./docs/pg-sd2

      # 5. Build Docker image to verify it compiles correctly
      - name: Build Docker image
        run: docker build -t gametips-test .
        working-directory: ./docs/pg-sd2

      # 6. Run Docker Compose (build only, no start)
      - name: Docker Compose build
        run: docker compose build
        working-directory: ./docs/pg-sd2
